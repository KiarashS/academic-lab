# Slides for the slider at the top of the home page. Turn the slider off by removing
# 'slider' from home.sections in src/config/site.js; timing settings are in home.slider.
#
# type: image  -> src, alt
# type: video  -> src: an uploaded file (/uploads/clip.mp4) or a direct link to one
#                 (https://.../clip.mp4; Dropbox share links work too). MP4 (H.264) or
#                 WebM, under 50 MB. Plays muted; the slider moves on when it ends. poster,
#                 sound: true to add a button that turns the sound on
# type: embed  -> src: a YouTube or Vimeo link (watch page, youtu.be or embed URL).
#                 Shows a poster with a play button; the player loads only when pressed.
#                 poster is optional for YouTube (its thumbnail is used).
# type can be left out: video files and YouTube/Vimeo links are recognised from src.
# Any slide: title, caption, link (/page or https://...; the whole slide becomes
# clickable), position (center | top | bottom), duration (ms, instead of home.slider.interval)

slides:
  - type: image
    src: /slides/slide-1.svg
    alt: ""
    title: Few-shot learning for scientific data
    caption: Models that adapt to a new experiment from tens of measurements.
    link: /research/few-shot-science
  - type: image
    src: /slides/slide-2.svg
    alt: ""
    title: ICML 2026 oral
    caption: Priya Nair presented our work on protein fitness landscapes.
    link: /publications
  - type: image
    src: /slides/slide-3.svg
    alt: ""
    title: We are hiring
    caption: PhD and postdoc positions for 2027.
    link: /join
