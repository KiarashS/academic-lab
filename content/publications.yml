# Publications entered by hand. Papers can also come from content/publications.bib and
# from ORCID (see publications.import in src/config/site.js). Order doesn't matter.
#
# Fields: id (unique, also the BibTeX key), title, authors, venue, year, type
# (journal | conference | workshop | preprint | book | thesis | other), month (1-12),
# volume, pages, publisher, featured (show on the home page), award, tags, projects
# (research ids), summary (a plain-language version of the abstract, for readers outside
# the field), abstract, media (an image, GIF, MP4/WebM video or YouTube/Vimeo link shown
# beside the paper; or { src, alt, poster }), bibtex (replaces the generated entry),
# links: pdf, doi, arxiv, code, project, slides, video, poster, data
publications:
  - id: nair2026metaprot
    title: Meta-learning protein fitness landscapes from few measurements
    authors:
      - Priya Nair
      - Sam Chen
      - Alex Rivera
    venue: International Conference on Machine Learning (ICML)
    year: 2026
    month: 7
    type: conference
    featured: true
    award: Oral presentation
    media: /slides/slide-1.svg
    tags:
      - meta-learning
      - biology
    projects:
      - few-shot-science
    summary: Testing how well a protein works takes days per variant. This model learns from earlier experiments on related proteins, so it can make useful predictions for a new protein after only 20 tests.
    abstract: We present a meta-learning approach that predicts protein fitness from as few as 20 labeled variants by transferring structure across related assays.
