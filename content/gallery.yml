# Photo albums for the Gallery page. Put photos in public/uploads/ (or any folder in
# public/) and reference them as /uploads/name.jpg. Full URLs also work.
#
# Videos go in the same list: src can be an MP4/WebM file (/uploads/clip.mp4, under
# 50 MB), a direct link to one, or a YouTube/Vimeo link. Add poster: for a thumbnail;
# without one a video file shows its first frame and YouTube its own thumbnail.
# Each item: src, caption, alt, poster
albums:
  - title: Lab retreat 2026
    date: 2026-08-20
    description: Two days of planning and hiking.
    photos:
      - src: /slides/slide-1.svg
        caption: Planning session
      - src: /slides/slide-2.svg
        caption: The view from the ridge
      - src: /slides/slide-3.svg
        caption: Group dinner
  - title: ICML 2026
    date: 2026-07-15
    photos:
      - src: /slides/slide-2.svg
        caption: Priya's oral presentation
      - src: /slides/slide-1.svg
        caption: Poster session
