# Builds the site and publishes it to GitHub Pages on every push to main and every night.
# In the repository settings, set Pages > Source to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild every night so new ORCID papers, citation counts, the copyright year and
  # "upcoming" events stay current without anyone pushing a change. (GitHub pauses
  # scheduled runs after 60 days without commits; any push or a manual run restarts them.)
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      # Keep resized photos and social images between runs so only new ones are made.
      # (After npm ci, which empties node_modules.)
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/academic-lab/img
            node_modules/.cache/academic-lab/og
          key: images-${{ hashFiles('public/**', 'content/**') }}
          restore-keys: images-
      # Imported papers and other fetched data, saved after every run so that if a source
      # (Google Scholar, DBLP) refuses a request, the build can fall back to the last copy.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/academic-lab/json
          key: fetched-${{ github.run_id }}
          restore-keys: fetched-
      - run: npm run build
        env:
          # Raises GitHub's API limit for the repository details on Software & Data.
          GITHUB_TOKEN: ${{ github.token }}
          # e.g. '/academic-lab/' for a project site, '/' for a custom domain
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
