# Checks pull requests (including edits proposed through /admin in editorial workflow)
# before they reach the live site: the content must have no problems (`npm run check`)
# and the site must build.
name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          STRICT_CONTENT: '1'
